name: Playwright Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baseline:
        description: 'Regenerate visual regression baselines (all browsers, Linux) instead of running the full suite'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start app server
        run: npm run serve &

      - name: Wait for server to be ready
        run: npx wait-on http://127.0.0.1:7002 --timeout 30000

      - name: Run Playwright tests
        if: ${{ github.event.inputs.update_visual_baseline != 'true' }}
        run: npx playwright test

      - name: Update visual regression baselines
        if: ${{ github.event.inputs.update_visual_baseline == 'true' }}
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            results.json
            playwright-report/
          retention-days: 30

      - name: Upload regenerated visual baselines
        uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.update_visual_baseline == 'true' }}
        with:
          name: visual-baselines-linux
          path: tests/visual.spec.ts-snapshots/
          retention-days: 30
